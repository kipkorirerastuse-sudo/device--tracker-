<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Map Viewer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100%; width: 100%; }
        #info-box { position: absolute; top: 10px; left: 50px; z-index: 1000; background: white; padding: 15px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); font-family: sans-serif; }
    </style>
</head>
<body>

    <div id="info-box">
        <h3>Live Device Tracker</h3>
        <p id="time">Waiting for data...</p>
    </div>
    <div id="map"></div>

    <script>
        // REPLACE THESE WITH YOUR ACTUAL SUPABASE CREDENTIALS
        const SUPABASE_URL = "https://your-project-id.supabase.co";
        const SUPABASE_ANON_KEY = "your-anon-public-key";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Initialize default map view centered on 0,0
        const map = L.map('map').setView([0, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let marker = null;

        async function fetchLatestLocation() {
            // Get the single newest entry from the table
            const { data, error } = await supabase
                .from('device_locations')
                .select('latitude, longitude, created_at')
                .order('created_at', { ascending: false })
                .limit(1);

            if (error) {
                console.error("Error fetching location:", error);
                return;
            }

            if (data && data.length > 0) {
                const { latitude, longitude, created_at } = data[0];
                const timeStr = new Date(created_at).toLocaleTimeString();
                
                document.getElementById('time').textContent = `Last update: ${timeStr}`;

                // Update marker position on map
                if (marker === null) {
                    marker = L.marker([latitude, longitude]).addTo(map);
                    map.setView([latitude, longitude], 16); // Zoom close once found
                } else {
                    marker.setLatLng([latitude, longitude]);
                }
            }
        }

        // Poll Supabase for updates every 5 seconds
        fetchLatestLocation();
        setInterval(fetchLatestLocation, 5000);
    </script>
</body>
</html>
